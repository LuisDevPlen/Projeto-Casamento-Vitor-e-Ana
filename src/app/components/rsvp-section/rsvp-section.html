<section class="rsvp" id="presenca">
  <h2 class="section-title">Confirme sua presença</h2>

  @if (submitted()) {
    <div class="rsvp__success">
      <h3>Tudo certo!</h3>
      <p>Abrimos o WhatsApp com a sua mensagem para o casal. É só enviar.</p>
    </div>
  } @else {
    <form class="rsvp__form" (submit)="confirm($event)" novalidate>
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text" placeholder="Insira seu nome completo" [(ngModel)]="name" />
      @if (tried() && !name.trim()) {
        <p class="rsvp__error">Informe seu nome completo.</p>
      }

      <label>Você irá ao evento?</label>
      <div class="rsvp__choice">
        <label>
          <input type="radio" name="presenca" value="sim" [(ngModel)]="attending" />
          sim
        </label>
        <label>
          <input type="radio" name="presenca" value="nao" [(ngModel)]="attending" />
          não
        </label>
      </div>

      <div class="rsvp__row">
        <div>
          <label for="adultos">Quantidade de adultos incluindo você</label>
          <select id="adultos" name="adultos" [(ngModel)]="adults">
            @for (quantity of quantities; track quantity) {
              @if (quantity > 0) {
                <option [ngValue]="quantity">{{ quantity }}</option>
              }
            }
          </select>
        </div>
        <div>
          <label for="criancas">Quantidade de crianças</label>
          <select id="criancas" name="criancas" [(ngModel)]="children">
            @for (quantity of quantities; track quantity) {
              <option [ngValue]="quantity">{{ quantity }}</option>
            }
          </select>
        </div>
      </div>

      <label for="telefone">Telefone para contato</label>
      <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" [(ngModel)]="phone" />

      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes" [(ngModel)]="notes"></textarea>

      <label class="rsvp__check">
        <input type="checkbox" name="aceite" [(ngModel)]="accepted" />
        <span>Declaro que li e concordo em compartilhar meus dados com o casal para confirmar presença.</span>
      </label>
      @if (tried() && !accepted) {
        <p class="rsvp__error">É preciso aceitar para confirmar.</p>
      }

      <button class="rsvp__submit" type="submit">Confirmar presença</button>
    </form>
  }
</section>
